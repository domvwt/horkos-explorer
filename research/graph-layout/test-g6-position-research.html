<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G6 Position Persistence Research</title>
  <script src="https://unpkg.com/@antv/g6@5.0.49/dist/g6.min.js"></script>
  <style>
    body {
      font-family: monospace;
      margin: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    #container {
      width: 800px;
      height: 600px;
      border: 2px solid #555;
      background: #252526;
      margin: 20px 0;
    }
    #log {
      background: #1e1e1e;
      border: 2px solid #555;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 12px;
    }
    .test-section {
      border-bottom: 1px solid #555;
      padding: 10px 0;
      margin: 10px 0;
    }
    .success {
      color: #4ec9b0;
    }
    .error {
      color: #f48771;
    }
    .info {
      color: #dcdcaa;
    }
    .warning {
      color: #ce9178;
    }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #1177bb;
    }
  </style>
</head>
<body>
  <h1>G6 v5 + d3-force Position Persistence Research</h1>
  <p>This test verifies all questions from research/investigation-sharing/README.md</p>

  <div>
    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="clearLog()">Clear Log</button>
    <button onclick="testRecreateWithPositions()">Test 5: Recreate Graph</button>
  </div>

  <div id="container"></div>
  <div id="log"></div>

  <script>
    const { Graph } = window.G6;
    let graph = null;
    let testData = null;

    // Logging utilities
    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const className = type;
      const timestamp = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(`[${type.toUpperCase()}]`, message);
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    function logSection(title) {
      log(`\n${'='.repeat(80)}`, 'info');
      log(`  ${title}`, 'info');
      log('='.repeat(80), 'info');
    }

    // Sample data matching Horkos schema
    const sampleData = {
      nodes: [
        {
          id: 'person_1',
          data: {
            label: 'John Smith',
            type: 'Person',
            size: 50,
            birth_year: 1975
          }
        },
        {
          id: 'company_1',
          data: {
            label: 'Acme Corp',
            type: 'Company',
            size: 60,
            company_number: '12345678'
          }
        },
        {
          id: 'person_2',
          data: {
            label: 'Jane Doe',
            type: 'Person',
            size: 50,
            birth_year: 1980
          }
        },
        {
          id: 'company_2',
          data: {
            label: 'Beta Ltd',
            type: 'Company',
            size: 55,
            company_number: '87654321'
          }
        },
        {
          id: 'address_1',
          data: {
            label: 'London Office',
            type: 'Address',
            size: 45,
            post_code: 'SW1A 1AA'
          }
        }
      ],
      edges: [
        {
          id: 'edge_1',
          source: 'person_1',
          target: 'company_1',
          data: {
            label: 'Directorship',
            type: 'Directorship'
          }
        },
        {
          id: 'edge_2',
          source: 'person_2',
          target: 'company_1',
          data: {
            label: 'PersonOwnership',
            type: 'PersonOwnership',
            percentage: 25.0
          }
        },
        {
          id: 'edge_3',
          source: 'company_1',
          target: 'company_2',
          data: {
            label: 'CorporateOwnership',
            type: 'CorporateOwnership',
            percentage: 51.0
          }
        },
        {
          id: 'edge_4',
          source: 'company_1',
          target: 'address_1',
          data: {
            label: 'RegisteredAddress',
            type: 'RegisteredAddress'
          }
        }
      ]
    };

    // Initialize graph with d3-force layout
    function initGraph() {
      if (graph) {
        graph.destroy();
      }

      log('Initializing G6 graph with d3-force layout...', 'info');

      graph = new Graph({
        container: 'container',
        width: 800,
        height: 600,
        layout: {
          type: 'd3-force',
          link: {
            distance: 150,
            strength: 2
          },
          collide: {
            radius: (d) => (d.data.size || 50) / 2 + 80,
            strength: 1.2
          },
          manyBody: {
            strength: -1800
          },
          alpha: 1,
          alphaMin: 0.2,
          alphaDecay: 0.03,
          velocityDecay: 0.45
        },
        node: (model) => {
          return {
            id: model.id,
            data: {
              ...model.data,
              type: 'circle-node',
              labelText: model.data.label,
              labelPosition: 'bottom',
              size: model.data.size || 50
            }
          };
        },
        edge: (model) => {
          return {
            id: model.id,
            source: model.source,
            target: model.target,
            data: {
              ...model.data,
              type: 'line-edge',
              labelText: model.data.label
            }
          };
        }
      });

      testData = JSON.parse(JSON.stringify(sampleData));
      graph.setData(testData);
      graph.render();

      log('Graph initialized and rendering...', 'success');
      return graph;
    }

    // TEST 1: Can we read positions from simulation?
    function test1_ReadPositions() {
      logSection('TEST 1: Read Positions from d3-force Simulation');

      try {
        const layout = graph.getLayout();
        log('✓ graph.getLayout() returned:', 'success');
        log(JSON.stringify(Object.keys(layout), null, 2), 'info');

        if (!layout.simulation) {
          log('✗ layout.simulation is undefined!', 'error');
          log('Available layout properties: ' + Object.keys(layout).join(', '), 'warning');
          return false;
        }

        const simNodes = layout.simulation.nodes();
        log(`✓ layout.simulation.nodes() returned ${simNodes.length} nodes`, 'success');

        // Check first 2 nodes in detail
        simNodes.slice(0, 2).forEach((node, idx) => {
          log(`\nNode ${idx} (${node.id}):`, 'info');
          log(`  x: ${node.x}`, 'info');
          log(`  y: ${node.y}`, 'info');
          log(`  fx: ${node.fx}`, 'info');
          log(`  fy: ${node.fy}`, 'info');
          log(`  Other props: ${Object.keys(node).filter(k => !['id','x','y','fx','fy','vx','vy','index'].includes(k)).join(', ')}`, 'info');
        });

        // Verify all nodes have valid positions
        const hasValidPositions = simNodes.every(n =>
          typeof n.x === 'number' &&
          typeof n.y === 'number' &&
          !isNaN(n.x) &&
          !isNaN(n.y)
        );

        if (hasValidPositions) {
          log('\n✓ PASS: All nodes have valid x/y positions', 'success');
          return true;
        } else {
          log('\n✗ FAIL: Some nodes have invalid positions', 'error');
          return false;
        }
      } catch (error) {
        log(`✗ FAIL: ${error.message}`, 'error');
        console.error(error);
        return false;
      }
    }

    // TEST 2: Can we set fx/fy and do they persist in simulation?
    function test2_SetFixedPositions() {
      logSection('TEST 2: Set fx/fy on Simulation Nodes');

      try {
        const layout = graph.getLayout();
        const simNodes = layout.simulation.nodes();

        log('Setting fx/fy on all simulation nodes...', 'info');

        const modifiedNodes = simNodes.map(node => ({
          ...node,
          fx: node.x,
          fy: node.y
        }));

        log(`Modified ${modifiedNodes.length} nodes`, 'info');

        // Update simulation with modified nodes
        layout.simulation.nodes(modifiedNodes);
        log('Called layout.simulation.nodes(modifiedNodes)', 'info');

        // Read back to verify
        const verifyNodes = layout.simulation.nodes();

        log('\nVerifying fx/fy were set:', 'info');
        verifyNodes.slice(0, 2).forEach((node, idx) => {
          log(`Node ${idx} (${node.id}):`, 'info');
          log(`  x: ${node.x}, fx: ${node.fx}`, 'info');
          log(`  y: ${node.y}, fy: ${node.fy}`, 'info');
        });

        const allFixed = verifyNodes.every(n =>
          typeof n.fx === 'number' &&
          typeof n.fy === 'number' &&
          !isNaN(n.fx) &&
          !isNaN(n.fy)
        );

        if (allFixed) {
          log('\n✓ PASS: All nodes have fx/fy set in simulation', 'success');
          return true;
        } else {
          log('\n✗ FAIL: Not all nodes have fx/fy set', 'error');
          return false;
        }
      } catch (error) {
        log(`✗ FAIL: ${error.message}`, 'error');
        console.error(error);
        return false;
      }
    }

    // TEST 3: Does getNodeData() include fx/fy?
    function test3_NodeDataIncludesFxFy() {
      logSection('TEST 3: Check if getNodeData() Includes fx/fy');

      try {
        const nodeData = graph.getNodeData();
        log(`graph.getNodeData() returned ${nodeData.length} nodes`, 'info');

        // Check first 2 nodes
        log('\nNode data structure:', 'info');
        nodeData.slice(0, 2).forEach((node, idx) => {
          log(`\nNode ${idx} (${node.id}):`, 'info');
          log(JSON.stringify(node, null, 2), 'info');
        });

        // Check if fx/fy exist anywhere in node data
        const hasFxFy = nodeData.some(n =>
          (n.fx !== undefined || n.fy !== undefined) ||
          (n.data && (n.data.fx !== undefined || n.data.fy !== undefined))
        );

        if (hasFxFy) {
          log('\n✓ PASS: fx/fy found in node data', 'success');
          return true;
        } else {
          log('\n✗ FAIL: fx/fy NOT found in node data', 'error');
          log('   This means G6 does not automatically sync simulation state to node data', 'warning');
          return false;
        }
      } catch (error) {
        log(`✗ FAIL: ${error.message}`, 'error');
        console.error(error);
        return false;
      }
    }

    // TEST 4: Can we manually merge positions into node data?
    function test4_ManualMergePositions() {
      logSection('TEST 4: Manually Merge Positions into Node Data');

      try {
        const layout = graph.getLayout();
        const simNodes = layout.simulation.nodes();
        const nodeData = graph.getNodeData();

        log('Creating position map from simulation...', 'info');
        const positionMap = {};
        simNodes.forEach(node => {
          positionMap[node.id] = { x: node.x, y: node.y };
        });

        log('Merging positions into node data...', 'info');
        const mergedNodes = nodeData.map(node => ({
          ...node,
          data: {
            ...node.data,
            fx: positionMap[node.id]?.x,
            fy: positionMap[node.id]?.y
          }
        }));

        log('\nSample merged node data:', 'info');
        log(JSON.stringify(mergedNodes[0], null, 2), 'info');

        const allHavePositions = mergedNodes.every(n =>
          typeof n.data.fx === 'number' &&
          typeof n.data.fy === 'number'
        );

        if (allHavePositions) {
          log('\n✓ PASS: Successfully merged positions into node data', 'success');
          log('   This approach can be used for serialization', 'success');

          // Store for test 5
          window.savedGraphData = {
            nodes: mergedNodes,
            edges: graph.getEdgeData()
          };

          return true;
        } else {
          log('\n✗ FAIL: Merge incomplete', 'error');
          return false;
        }
      } catch (error) {
        log(`✗ FAIL: ${error.message}`, 'error');
        console.error(error);
        return false;
      }
    }

    // TEST 5: Does d3-force honor fx/fy on graph recreation?
    function test5_RecreateWithFixedPositions() {
      logSection('TEST 5: Recreate Graph with Fixed Positions');

      if (!window.savedGraphData) {
        log('✗ No saved graph data - run Test 4 first', 'error');
        return false;
      }

      try {
        log('Saving current positions...', 'info');
        const layout = graph.getLayout();
        const originalPositions = {};
        layout.simulation.nodes().forEach(node => {
          originalPositions[node.id] = { x: node.x, y: node.y };
        });

        log('Destroying current graph...', 'info');
        graph.destroy();

        log('Creating new graph with saved data (including fx/fy)...', 'info');
        graph = new Graph({
          container: 'container',
          width: 800,
          height: 600,
          layout: {
            type: 'd3-force',
            link: { distance: 150, strength: 2 },
            collide: { radius: (d) => (d.data.size || 50) / 2 + 80, strength: 1.2 },
            manyBody: { strength: -1800 },
            alpha: 1,
            alphaMin: 0.2,
            alphaDecay: 0.03,
            velocityDecay: 0.45
          },
          node: (model) => {
            // Check if model has fx/fy in data and apply them
            const nodeConfig = {
              id: model.id,
              data: {
                ...model.data,
                type: 'circle-node',
                labelText: model.data.label || model.id,
                labelPosition: 'bottom',
                size: model.data.size || 50
              }
            };

            // Try to set initial position if fx/fy exist
            if (model.data.fx !== undefined && model.data.fy !== undefined) {
              nodeConfig.data.x = model.data.fx;
              nodeConfig.data.y = model.data.fy;
            }

            return nodeConfig;
          },
          edge: (model) => {
            return {
              id: model.id,
              source: model.source,
              target: model.target,
              data: {
                ...model.data,
                type: 'line-edge',
                labelText: model.data.label
              }
            };
          }
        });

        graph.setData(window.savedGraphData);
        graph.render();

        log('New graph rendered, waiting for layout stabilization...', 'info');

        // Check positions after a delay
        setTimeout(() => {
          const layout = graph.getLayout();
          const newPositions = {};
          layout.simulation.nodes().forEach(node => {
            newPositions[node.id] = { x: node.x, y: node.y };
          });

          log('\nPosition comparison:', 'info');
          let totalDrift = 0;
          let maxDrift = 0;

          Object.keys(originalPositions).forEach(id => {
            const orig = originalPositions[id];
            const curr = newPositions[id];
            const drift = Math.sqrt(
              Math.pow(orig.x - curr.x, 2) +
              Math.pow(orig.y - curr.y, 2)
            );

            totalDrift += drift;
            maxDrift = Math.max(maxDrift, drift);

            log(`${id}: drift = ${drift.toFixed(2)}px`, 'info');
          });

          const avgDrift = totalDrift / Object.keys(originalPositions).length;
          log(`\nAverage drift: ${avgDrift.toFixed(2)}px`, 'info');
          log(`Maximum drift: ${maxDrift.toFixed(2)}px`, 'info');

          // Allow small drift due to simulation initialization
          if (avgDrift < 50) {
            log('\n✓ PASS: Positions approximately preserved (drift < 50px)', 'success');
            log('   Note: Some drift is expected with d3-force layout', 'warning');
          } else if (avgDrift < 200) {
            log('\n⚠ PARTIAL: Positions somewhat preserved (drift < 200px)', 'warning');
            log('   Consider using fixed layout for exact preservation', 'warning');
          } else {
            log('\n✗ FAIL: Positions significantly changed (drift >= 200px)', 'error');
            log('   d3-force may not be respecting fx/fy in node data', 'error');
          }

          // Try to apply fx/fy directly to simulation after init
          log('\nAttempt: Setting fx/fy on simulation after graph init...', 'info');
          const simNodes = layout.simulation.nodes();
          simNodes.forEach(node => {
            const orig = originalPositions[node.id];
            if (orig) {
              node.fx = orig.x;
              node.fy = orig.y;
            }
          });
          layout.simulation.nodes(simNodes);
          layout.simulation.alpha(1).restart();

          log('✓ Applied fx/fy to simulation - nodes should now be fixed', 'success');
        }, 3000);

        return true;
      } catch (error) {
        log(`✗ FAIL: ${error.message}`, 'error');
        console.error(error);
        return false;
      }
    }

    // Run all tests sequentially
    async function runAllTests() {
      clearLog();
      logSection('G6 Position Persistence Research - Full Test Suite');

      // Initialize fresh graph
      initGraph();

      // Wait for layout to stabilize
      log('\nWaiting 3 seconds for d3-force layout to stabilize...', 'info');

      setTimeout(() => {
        log('\nStarting tests...', 'success');

        const results = [];

        results.push({ name: 'Test 1: Read Positions', pass: test1_ReadPositions() });

        setTimeout(() => {
          results.push({ name: 'Test 2: Set fx/fy', pass: test2_SetFixedPositions() });

          setTimeout(() => {
            results.push({ name: 'Test 3: getNodeData() fx/fy', pass: test3_NodeDataIncludesFxFy() });

            setTimeout(() => {
              results.push({ name: 'Test 4: Manual Merge', pass: test4_ManualMergePositions() });

              setTimeout(() => {
                test5_RecreateWithFixedPositions();

                // Final summary
                setTimeout(() => {
                  logSection('TEST SUMMARY');
                  results.forEach(r => {
                    const status = r.pass ? '✓ PASS' : '✗ FAIL';
                    const color = r.pass ? 'success' : 'error';
                    log(`${status}: ${r.name}`, color);
                  });

                  logSection('CONCLUSIONS & RECOMMENDATIONS');
                  log('See detailed findings in the log above', 'info');
                }, 6000);
              }, 500);
            }, 500);
          }, 500);
        }, 500);
      }, 3000);
    }

    // Auto-run on load
    window.onload = () => {
      log('Test page loaded. Click "Run All Tests" to begin.', 'info');
      log('Or run individual tests using test1_ReadPositions(), test2_SetFixedPositions(), etc. in console', 'info');
    };

    // Expose test functions to console
    window.test1_ReadPositions = test1_ReadPositions;
    window.test2_SetFixedPositions = test2_SetFixedPositions;
    window.test3_NodeDataIncludesFxFy = test3_NodeDataIncludesFxFy;
    window.test4_ManualMergePositions = test4_ManualMergePositions;
    window.test5_RecreateWithFixedPositions = test5_RecreateWithFixedPositions;
    window.testRecreateWithPositions = test5_RecreateWithFixedPositions;
  </script>
</body>
</html>
