<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G6 Dynamic Layout Switching Test</title>
  <script src="https://unpkg.com/@antv/g6@5.0.49/dist/g6.min.js"></script>
  <style>
    body {
      font-family: monospace;
      margin: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    #container {
      width: 800px;
      height: 600px;
      border: 2px solid #555;
      background: #252526;
      margin: 20px 0;
    }
    #log {
      background: #1e1e1e;
      border: 2px solid #555;
      padding: 15px;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 12px;
    }
    .success { color: #4ec9b0; }
    .error { color: #f48771; }
    .info { color: #dcdcaa; }
    .warning { color: #ce9178; }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #1177bb; }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>G6 Dynamic Layout Switching Test</h1>
  <p>Test if we can switch from fixed → d3-force after loading</p>

  <div>
    <button id="runTest" onclick="runTest()">Run Test</button>
    <button id="switchToForce" onclick="switchToForce()" disabled>Manual: Switch to Force</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>

  <div id="container"></div>
  <div id="log"></div>

  <script>
    const { Graph } = window.G6;
    let graph = null;
    let savedPositions = null;

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<span class="${type}">[${timestamp}] ${message}</span>\n`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    function logSection(title) {
      log(`\n${'='.repeat(80)}`, 'info');
      log(`  ${title}`, 'info');
      log('='.repeat(80), 'info');
    }

    const sampleData = {
      nodes: [
        { id: 'person_1', data: { label: 'John Smith', type: 'Person', size: 50 }},
        { id: 'company_1', data: { label: 'Acme Corp', type: 'Company', size: 60 }},
        { id: 'person_2', data: { label: 'Jane Doe', type: 'Person', size: 50 }},
        { id: 'company_2', data: { label: 'Beta Ltd', type: 'Company', size: 55 }},
        { id: 'address_1', data: { label: 'London', type: 'Address', size: 45 }}
      ],
      edges: [
        { id: 'edge_1', source: 'person_1', target: 'company_1', data: { label: 'Director' }},
        { id: 'edge_2', source: 'person_2', target: 'company_1', data: { label: 'Owner' }},
        { id: 'edge_3', source: 'company_1', target: 'company_2', data: { label: 'Owner' }},
        { id: 'edge_4', source: 'company_1', target: 'address_1', data: { label: 'Address' }}
      ]
    };

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function runTest() {
      clearLog();
      document.getElementById('runTest').disabled = true;
      document.getElementById('switchToForce').disabled = true;

      logSection('AUTOMATIC LAYOUT SWITCHING TEST');

      // Step 1: Create graph with d3-force and capture positions
      logSection('STEP 1: Create Initial Graph with d3-force');
      log('Creating graph...', 'info');

      if (graph) graph.destroy();

      graph = new Graph({
        container: 'container',
        width: 800,
        height: 600,
        layout: {
          type: 'd3-force',
          link: { distance: 150, strength: 2 },
          collide: { radius: (d) => (d.data.size || 50) / 2 + 80, strength: 1.2 },
          manyBody: { strength: -1800 }
        },
        node: (model) => ({
          id: model.id,
          data: {
            ...model.data,
            type: 'circle-node',
            labelText: model.data.label,
            labelPosition: 'bottom',
            size: model.data.size || 50
          }
        }),
        edge: (model) => ({
          id: model.id,
          source: model.source,
          target: model.target,
          data: { ...model.data, type: 'line-edge', labelText: model.data.label }
        })
      });

      graph.setData(JSON.parse(JSON.stringify(sampleData)));
      graph.render();

      log('Waiting 3s for d3-force to stabilize...', 'info');
      await sleep(3000);

      // Capture positions
      const nodes = graph.getNodeData();
      savedPositions = {};
      nodes.forEach(n => {
        savedPositions[n.id] = { x: n.style.x, y: n.style.y };
      });
      log('✓ Positions captured', 'success');

      // Step 2: Simulate loading from shared URL with fixed layout
      logSection('STEP 2: Simulate Loading Shared Investigation (Fixed Layout)');

      const serializedData = {
        nodes: nodes.map(n => ({
          id: n.id,
          data: { ...n.data, x: n.style.x, y: n.style.y },
          style: n.style
        })),
        edges: graph.getEdgeData()
      };

      log('Destroying graph and recreating with fixed layout...', 'info');
      graph.destroy();
      await sleep(500);

      graph = new Graph({
        container: 'container',
        width: 800,
        height: 600,
        layout: { type: 'fixed' },
        node: (model) => {
          const config = {
            id: model.id,
            data: {
              ...model.data,
              type: 'circle-node',
              labelText: model.data.label,
              labelPosition: 'bottom',
              size: model.data.size || 50
            }
          };
          if (model.data.x !== undefined && model.data.y !== undefined) {
            config.data.x = model.data.x;
            config.data.y = model.data.y;
          }
          return config;
        },
        edge: (model) => ({
          id: model.id,
          source: model.source,
          target: model.target,
          data: { ...model.data, type: 'line-edge', labelText: model.data.label }
        })
      });

      graph.setData(serializedData);
      graph.render();

      log('✓ Graph loaded with fixed layout', 'success');
      await sleep(1000);

      // Verify positions are preserved
      const fixedNodes = graph.getNodeData();
      let totalDrift = 0;
      fixedNodes.forEach(n => {
        const drift = Math.sqrt(
          Math.pow(savedPositions[n.id].x - n.style.x, 2) +
          Math.pow(savedPositions[n.id].y - n.style.y, 2)
        );
        totalDrift += drift;
      });
      const avgDrift = totalDrift / fixedNodes.length;
      log(`Fixed layout drift: ${avgDrift.toFixed(2)}px`, avgDrift < 5 ? 'success' : 'warning');

      // Step 3: Automatically switch to d3-force
      logSection('STEP 3: Automatically Switch to d3-force Layout');
      log('Attempting to switch layout dynamically...', 'info');

      try {
        // Method 1: Try graph.updateLayout()
        log('Trying graph.updateLayout()...', 'info');

        if (typeof graph.updateLayout === 'function') {
          graph.updateLayout({
            type: 'd3-force',
            link: { distance: 150, strength: 2 },
            collide: { radius: (d) => (d.data.size || 50) / 2 + 80, strength: 1.2 },
            manyBody: { strength: -1800 },
            alpha: 0.3,  // Lower alpha for less movement
            alphaMin: 0.001,
            alphaDecay: 0.05
          });

          log('✓ updateLayout() succeeded!', 'success');
          log('Waiting 2s for layout to stabilize...', 'info');
          await sleep(2000);

          // Measure drift after switching
          const forceNodes = graph.getNodeData();
          let totalDriftAfterSwitch = 0;
          forceNodes.forEach(n => {
            const drift = Math.sqrt(
              Math.pow(savedPositions[n.id].x - n.style.x, 2) +
              Math.pow(savedPositions[n.id].y - n.style.y, 2)
            );
            totalDriftAfterSwitch += drift;
          });
          const avgDriftAfterSwitch = totalDriftAfterSwitch / forceNodes.length;

          logSection('RESULTS');
          log(`Position drift after switching to force: ${avgDriftAfterSwitch.toFixed(2)}px`,
              avgDriftAfterSwitch < 50 ? 'success' : 'warning');

          if (avgDriftAfterSwitch < 10) {
            log('\n✓✓ SUCCESS: Layout switching works with minimal drift!', 'success');
            log('   Solution: Load with fixed, auto-switch to d3-force after render', 'success');
          } else if (avgDriftAfterSwitch < 50) {
            log('\n✓ ACCEPTABLE: Layout switching works with minor drift', 'success');
            log('   Users can still drag/reposition nodes', 'success');
          } else {
            log('\n⚠ WARNING: Switching causes significant drift', 'warning');
            log('   May want to keep fixed layout by default', 'warning');
          }

          document.getElementById('switchToForce').disabled = false;

        } else {
          log('✗ graph.updateLayout() not available', 'error');
          log('Checking for alternative methods...', 'info');

          // Method 2: Try graph.layout()
          if (typeof graph.layout === 'function') {
            log('Trying graph.layout()...', 'info');
            graph.layout({
              type: 'd3-force',
              link: { distance: 150, strength: 2 },
              collide: { radius: (d) => (d.data.size || 50) / 2 + 80, strength: 1.2 },
              manyBody: { strength: -1800 }
            });
            log('✓ graph.layout() succeeded!', 'success');
          } else {
            log('✗ graph.layout() not available', 'error');
            log('\nConclusion: Dynamic layout switching may not be supported', 'warning');
            log('Alternative: Provide manual "Switch to Force Layout" button', 'info');
          }
        }

      } catch (error) {
        log(`✗ Error during layout switch: ${error.message}`, 'error');
        log('\nConclusion: Dynamic switching not supported', 'warning');
        log('Alternative: Manual button or recreate graph', 'info');
      }

      document.getElementById('runTest').disabled = false;
    }

    async function switchToForce() {
      logSection('MANUAL SWITCH TO FORCE LAYOUT');

      if (!graph) {
        log('✗ No graph instance', 'error');
        return;
      }

      try {
        log('Switching to d3-force layout...', 'info');

        graph.updateLayout({
          type: 'd3-force',
          link: { distance: 150, strength: 2 },
          collide: { radius: (d) => (d.data.size || 50) / 2 + 80, strength: 1.2 },
          manyBody: { strength: -1800 },
          alpha: 0.5,
          alphaMin: 0.001,
          alphaDecay: 0.03
        });

        log('✓ Switched to force layout', 'success');
        log('Watch the graph adjust positions...', 'info');

      } catch (error) {
        log(`✗ Error: ${error.message}`, 'error');
      }
    }

    window.onload = () => {
      log('Test page loaded. Click "Run Test" to begin.', 'info');
    };
  </script>
</body>
</html>
