name: Build-And-Deploy

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      isNightly:
        description: "Whether the build is a nightly build?"
        type: boolean
        required: true
        default: false

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  prebuild:
    needs: lint
    name: Prebuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prebuild - install node
        uses: actions/setup-node@v3
        with:
          node-version: "20"
      - name: Prebuild - install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Prebuild - install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prebuild - generate grammar
        run: npm run generate-grammar-prod
      - name: Prebuild - build app
        run: npm run build
      # actions/upload-artifact@v4 drops dotfiles, so the docker build context
      # produced by "Upload current directory" below has no .dockerignore, and
      # the prebuilt dist/ enters the image via `COPY .` in the docker job
      # (which builds with SKIP_BUILD_APP=true). Removing .dockerignore here
      # makes that load-bearing behaviour deliberate instead of accidental.
      - name: Prebuild - cleanup
        run: rm -rf node_modules .git explorer.db .dockerignore
      - name: Upload current directory
        uses: actions/upload-artifact@v4
        with:
          path: .
          name: explorer-prebuild

  docker:
    needs: prebuild
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Download prebuild
        uses: actions/download-artifact@v4
        with:
          name: explorer-prebuild
      - name: Set tag for nightly build
        if: ${{ github.event.inputs.isNightly == 'true' }}
        run: echo "TAGS=ghcr.io/${{ github.repository_owner }}/explorer:dev" >> $GITHUB_ENV
      - name: Set tag for release build
        if: ${{ github.event.inputs.isNightly != 'true' }}
        run: |
          VERSION_TAG=$(date -u +%Y%m%d)-${GITHUB_SHA::7}
          echo "TAGS=ghcr.io/${{ github.repository_owner }}/explorer:latest,ghcr.io/${{ github.repository_owner }}/explorer:${VERSION_TAG}" >> $GITHUB_ENV
      - name: Show tags
        run: echo $TAGS
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            SKIP_GRAMMAR=true
            SKIP_BUILD_APP=true
