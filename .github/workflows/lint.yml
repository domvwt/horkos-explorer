name: Lint

on:
  pull_request:
    branches:
      - master
  workflow_call:

# Default the workflow token to read-only. A fork PR runs untrusted code from
# the PR head; a write-scoped token at the top level would be exposed to that
# code. The auto-commit job below re-grants contents:write at the JOB level,
# and its push-back step is additionally gated to same-repo refs only, so a
# fork PR never runs with a writable token.
permissions:
  checks: write
  contents: read

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest
    # Job-level write scope so the same-repo auto-commit step can push back.
    # This is safe because the push-back step is gated to same-repo refs and
    # fork-PR code therefore never reaches a writable token (the top-level
    # default stays read-only for the fork-PR path).
    permissions:
      checks: write
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # --ignore-scripts: a fork PR head is untrusted code. Without this,
      # pnpm would run arbitrary install lifecycle scripts (preinstall/install/
      # postinstall) from the PR's package.json in the runner. Linting does not
      # need built native modules, so skip all lifecycle scripts on install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Dependency audit gate: fails the build on any high/critical advisory in
      # the production (runtime) dependency tree. Build-only toolchain advisories
      # (native-module compilation via node-gyp/node-pre-gyp, and webpack bundler
      # internals) are allowlisted by GHSA id in package.json > pnpm.auditConfig
      # because they do not execute at application runtime and cannot be patched
      # without risking the native duckdb/sqlite3/kuzu builds. A NEW high-severity
      # runtime vulnerability is not allowlisted and will fail this step.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Fail the build if the security-critical server-side Cypher parser twins
      # (src/server/middleware/cypher-parser/*.js) have drifted from the
      # committed grammar (src/utils/CypherParser/*.ts). This catches a grammar
      # bump that forgot to regenerate the CJS twins the read-only
      # QueryValidator depends on.
      - name: Check Cypher parser twins are in sync
        run: npm run check-cypher-parser-sync

      - name: Run linters without auto-fix (on master)
        if: github.ref == 'refs/heads/master'
        run: npm run eslint

      - name: Run linters with auto-fix (on non-master branches)
        if: github.ref != 'refs/heads/master'
        run: npm run eslint-fix

      # Push linter auto-fixes back to the branch. Gated to same-repo refs only:
      # for a fork PR, github.event.pull_request.head.repo.full_name is the
      # fork's slug (!= github.repository), so this step is skipped and no write
      # token is used against an untrusted head. For same-repo PRs it is the
      # base repo slug (== github.repository); for non-PR events (workflow_call
      # from a push to master/next) the pull_request object is absent, so the
      # ref check alone governs and this runs for same-repo pushes.
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        if: >-
          github.ref != 'refs/heads/master' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        with:
          author_name: Lint Bot
          message: 'Run linters'
